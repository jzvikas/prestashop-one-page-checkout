services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Jzvikas\OnePageCheckout\Integration\PrestaShopRuntimeProbe: ~

  Jzvikas\OnePageCheckout\Integration\RuntimeProbeInterface:
    alias: Jzvikas\OnePageCheckout\Integration\PrestaShopRuntimeProbe

  Jzvikas\OnePageCheckout\Integration\CheckoutCapabilityDetector: ~
  Jzvikas\OnePageCheckout\Integration\CheckoutActivationPolicy: ~
  Jzvikas\OnePageCheckout\Integration\CheckoutBrowserBootstrapFactory: ~
  Jzvikas\OnePageCheckout\Integration\CheckoutFrontendAssetRegistrar:
    public: true
  Jzvikas\OnePageCheckout\Integration\CheckoutShellRenderer: ~
  Jzvikas\OnePageCheckout\Integration\CheckoutProcessBuilder:
    public: true
  Jzvikas\OnePageCheckout\Integration\LegacyCheckoutRenderAdapter:
    public: true

  Jzvikas\OnePageCheckout\Checkout\CheckoutStateVersioner: ~
  Jzvikas\OnePageCheckout\Checkout\StaleCheckoutStateGuard: ~
  Jzvikas\OnePageCheckout\Checkout\CheckoutSectionDependencyResolver: ~
  Jzvikas\OnePageCheckout\Checkout\PrestaShopCheckoutStateFactory: ~

  Jzvikas\OnePageCheckout\Checkout\Identity\CheckoutIdentityService:
    arguments:
      $hashing: '@hashing'

  Jzvikas\OnePageCheckout\Checkout\Address\CheckoutAddressSelectionParser: ~
  Jzvikas\OnePageCheckout\Checkout\Address\CheckoutAddressSelectionService: ~
  Jzvikas\OnePageCheckout\Checkout\Address\CheckoutAddressFormService: ~

  Jzvikas\OnePageCheckout\Checkout\Carrier\CheckoutCarrierSelectionParser: ~
  Jzvikas\OnePageCheckout\Checkout\Carrier\CheckoutCarrierSelectionService: ~

  Jzvikas\OnePageCheckout\Checkout\Payment\CheckoutPaymentSelectionParser: ~
  Jzvikas\OnePageCheckout\Checkout\Payment\CheckoutPaymentSelectionService: ~

  Jzvikas\OnePageCheckout\Checkout\Agreements\CheckoutAgreementSelectionParser: ~
  Jzvikas\OnePageCheckout\Checkout\Agreements\CheckoutAgreementSelectionService: ~

  Jzvikas\OnePageCheckout\Checkout\Finalization\CheckoutFinalizationPreflightService: ~
  Jzvikas\OnePageCheckout\Checkout\Finalization\CheckoutOrderLifecycleCleanup:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
    public: true

  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutSessionProvider: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutSessionProviderInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutSessionProvider
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutCartPresenter: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutCartPresenterInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutCartPresenter
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutAddressBookPresenter: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutAddressBookPresenterInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutAddressBookPresenter
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutDeliveryOptionsPresenter: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutDeliveryOptionsPresenterInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutDeliveryOptionsPresenter
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutPaymentOptionsPresenter: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutPaymentOptionsPresenterInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutPaymentOptionsPresenter
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutAgreementsPresenter: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutAgreementsPresenterInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutAgreementsPresenter
  Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutTemplateRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutTemplateRendererInterface:
    alias: Jzvikas\OnePageCheckout\Checkout\Rendering\PrestaShopCheckoutTemplateRenderer
  Jzvikas\OnePageCheckout\Checkout\Rendering\IdentitySectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\AddressesSectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\DeliverySectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\PaymentSectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\AgreementsSectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\SummarySectionRenderer: ~
  Jzvikas\OnePageCheckout\Checkout\Rendering\CheckoutSectionRendererRegistry:
    arguments:
      $renderers:
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\IdentitySectionRenderer'
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\AddressesSectionRenderer'
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\DeliverySectionRenderer'
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\PaymentSectionRenderer'
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\AgreementsSectionRenderer'
        - '@Jzvikas\OnePageCheckout\Checkout\Rendering\SummarySectionRenderer'

  Jzvikas\OnePageCheckout\Security\CheckoutCsrfTokenValidator: ~
  Jzvikas\OnePageCheckout\Security\CheckoutMutationGuard: ~

  Jzvikas\OnePageCheckout\Concurrency\CheckoutCartMutex:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $timeoutSeconds: 5

  Jzvikas\OnePageCheckout\Concurrency\CheckoutCartMutexInterface:
    alias: Jzvikas\OnePageCheckout\Concurrency\CheckoutCartMutex

  Jzvikas\OnePageCheckout\Infrastructure\Persistence\DbalCheckoutServerSelectionsStore:
    arguments:
      $connection: '@doctrine.dbal.default_connection'

  Jzvikas\OnePageCheckout\Checkout\CheckoutServerSelectionsStoreInterface:
    alias: Jzvikas\OnePageCheckout\Infrastructure\Persistence\DbalCheckoutServerSelectionsStore

  Jzvikas\OnePageCheckout\Infrastructure\Persistence\DbalCheckoutFinalizationReservationStore:
    arguments:
      $connection: '@doctrine.dbal.default_connection'
      $ttlSeconds: 900

  Jzvikas\OnePageCheckout\Checkout\Finalization\CheckoutFinalizationReservationStoreInterface:
    alias: Jzvikas\OnePageCheckout\Infrastructure\Persistence\DbalCheckoutFinalizationReservationStore

  Jzvikas\OnePageCheckout\Checkout\CheckoutMutationOrchestrator: ~

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutIdentityMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutAddressSelectionMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutAddressFormMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutCarrierSelectionMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutPaymentSelectionMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutAgreementSelectionMutation:
    public: true

  Jzvikas\OnePageCheckout\Checkout\Mutation\CheckoutFinalizationMutation:
    public: true

  Jzvikas\OnePageCheckout\Http\CheckoutMutationResponseMapper:
    public: true
