name: PrestaShop Runtime

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    name: PrestaShop ${{ matrix.ps_ref }} runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - ps_ref: '9.0.3'
            family: '9.0'
            native_opc: '0'
          - ps_ref: '9.1.5'
            family: '9.1'
            native_opc: '0'
          - ps_ref: '9.2.0-beta.1'
            family: '9.2'
            native_opc: '1'

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: prestashop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, simplexml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install module dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Checkout PrestaShop ${{ matrix.ps_ref }}
        run: |
          git clone --depth 1 --branch "${{ matrix.ps_ref }}" https://github.com/PrestaShop/PrestaShop.git /tmp/prestashop

      - name: Install PrestaShop dependencies
        working-directory: /tmp/prestashop
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build PrestaShop Front Core assets
        working-directory: /tmp/prestashop
        run: bash tools/assets/build.sh front-core

      - name: Build Classic theme assets for PrestaShop 9.0
        if: matrix.family == '9.0'
        working-directory: /tmp/prestashop
        run: bash tools/assets/build.sh front-classic

      - name: Build Hummingbird theme assets
        working-directory: /tmp/prestashop
        run: bash tools/assets/build.sh front-hummingbird

      - name: Install PrestaShop
        working-directory: /tmp/prestashop
        run: |
          php install-dev/index_cli.php -- \
            --domain=localhost:8080 \
            --base_uri=/ \
            --db_server=127.0.0.1:3306 \
            --db_name=prestashop \
            --db_user=root \
            --db_password=root \
            --prefix=ps_ \
            --firstname=Runtime \
            --lastname=Tester \
            --password='Runtime123!' \
            --email=runtime@example.com \
            --language=en \
            --country=us \
            --all_languages=0 \
            --newsletter=0 \
            --send_email=0 \
            --ssl=0 \
            --fixtures=0

      - name: Mount and install jzonepagecheckout
        run: |
          rm -rf /tmp/prestashop/modules/jzonepagecheckout
          ln -s "$GITHUB_WORKSPACE" /tmp/prestashop/modules/jzonepagecheckout
          cd /tmp/prestashop
          php bin/console prestashop:module install jzonepagecheckout --no-interaction
          php bin/console cache:clear --no-warmup

      - name: Install native OPC conflict fixture
        if: matrix.native_opc == '1'
        working-directory: /tmp/prestashop
        run: |
          rm -rf modules/ps_onepagecheckout
          git clone https://github.com/PrestaShop/ps_onepagecheckout.git modules/ps_onepagecheckout
          cd modules/ps_onepagecheckout
          git checkout 431975196676bc8b4f2d1803625073e30075bb41
          composer install --no-interaction --no-progress --prefer-dist
          cd ../..
          php bin/console prestashop:module install ps_onepagecheckout --no-interaction || \
            php bin/console prestashop:module enable ps_onepagecheckout --no-interaction
          php bin/console cache:clear --no-warmup

      - name: Execute installed runtime contract
        run: |
          php tests/Runtime/InstalledModuleContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}" \
            "${{ matrix.native_opc }}"

      - name: Execute PrestaShop 9.1 finalization reservation MariaDB contract
        if: matrix.family == '9.1'
        run: |
          php tests/Runtime/FinalizationReservationMariaDbContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Execute PrestaShop 9.1 finalization reservation process-concurrency contract
        if: matrix.family == '9.1'
        run: |
          php tests/Runtime/FinalizationReservationConcurrencyMariaDbContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Execute Core process adapter contract
        run: |
          php tests/Runtime/CoreProcessAdapterContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Execute integration failure isolation contract
        run: |
          php tests/Runtime/IntegrationFailureIsolationContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Execute installed Smarty shell contract
        run: |
          php tests/Runtime/InstalledSmartyShellContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Execute module-front checkout session contract
        run: |
          php tests/Runtime/ModuleFrontCheckoutSessionContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}"

      - name: Start fail-closed Front Office HTTP server
        env:
          JZOPC_PRESTASHOP_ROOT: /tmp/prestashop
        run: |
          nohup php -S 127.0.0.1:8080 -t /tmp/prestashop "$GITHUB_WORKSPACE/tests/Runtime/prestashop-http-router.php" \
            >/tmp/jzopc-prestashop-http.log 2>&1 &
          echo $! >/tmp/jzopc-prestashop-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jzopc-prestashop-http.log
          exit 1

      - name: Execute fail-closed Front Office HTTP contract
        run: php tests/Runtime/FailClosedHttpContract.php http://localhost:8080

      - name: Stop fail-closed Front Office HTTP server
        run: |
          if test -f /tmp/jzopc-prestashop-http.pid; then
            pid="$(cat /tmp/jzopc-prestashop-http.pid)"
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 20); do
              if ! kill -0 "$pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
          fi

      - name: Build temporary active checkout fixture
        if: matrix.native_opc == '0'
        env:
          JZOPC_RUNTIME_ACTIVE_FIXTURE: '1'
        run: |
          bash tests/Runtime/build-active-checkout-fixture.sh \
            "$GITHUB_WORKSPACE" \
            /tmp/jzopc-active-fixture
          rm -rf /tmp/prestashop/modules/jzonepagecheckout
          ln -s /tmp/jzopc-active-fixture /tmp/prestashop/modules/jzonepagecheckout
          cd /tmp/prestashop
          php bin/console cache:clear --no-warmup

      - name: Install PrestaShop 9.1 check-payment browser fixture
        if: matrix.family == '9.1' && matrix.native_opc == '0'
        working-directory: /tmp/prestashop
        run: |
          rm -rf modules/ps_checkpayment
          git clone https://github.com/PrestaShop/ps_checkpayment.git modules/ps_checkpayment
          cd modules/ps_checkpayment
          git checkout 163eea350e29616f7cff343285d8c4bcc2b6cc44
          composer install --no-interaction --no-progress --prefer-dist
          cd ../..
          php bin/console prestashop:module install ps_checkpayment --no-interaction
          php -r '
            require "config/config.inc.php";
            if (!Configuration::updateValue("PS_GUEST_CHECKOUT_ENABLED", 1)
                || !Configuration::updateValue("CHEQUE_NAME", "JZ OPC Runtime Payee")
                || !Configuration::updateValue("CHEQUE_ADDRESS", "1 Runtime Payment Street")) {
                fwrite(STDERR, "Unable to configure the PrestaShop 9.1 browser payment fixture.\n");
                exit(1);
            }
          '
          php bin/console cache:clear --no-warmup

      - name: Prepare active checkout HTTP fixture
        if: matrix.native_opc == '0'
        run: |
          fixture_output="$(php /tmp/jzopc-active-fixture/tests/Runtime/PrepareActiveCheckoutHttpFixture.php \
            /tmp/prestashop \
            "${{ matrix.family }}")"
          printf '%s\n' "$fixture_output"
          product_id="$(printf '%s\n' "$fixture_output" | tail -n 1)"
          if ! [[ "$product_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Active checkout fixture did not return a valid product ID." >&2
            exit 1
          fi
          echo "JZOPC_RUNTIME_PRODUCT_ID=$product_id" >> "$GITHUB_ENV"

      - name: Execute active Core carrier availability contract
        if: matrix.native_opc == '0'
        run: |
          php /tmp/jzopc-active-fixture/tests/Runtime/ActiveCoreCarrierAvailabilityContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}" \
            "$JZOPC_RUNTIME_PRODUCT_ID"

      - name: Install active browser contract dependencies
        if: matrix.native_opc == '0'
        working-directory: tests/Browser
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start active Front Office HTTP server
        if: matrix.native_opc == '0'
        env:
          JZOPC_PRESTASHOP_ROOT: /tmp/prestashop
        run: |
          nohup php -S 127.0.0.1:8080 -t /tmp/prestashop "$GITHUB_WORKSPACE/tests/Runtime/prestashop-http-router.php" \
            >/tmp/jzopc-prestashop-active-http.log 2>&1 &
          echo $! >/tmp/jzopc-prestashop-active-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/jzopc-prestashop-active-http.log
          exit 1

      - name: Execute active checkout Chromium contract
        if: matrix.native_opc == '0'
        working-directory: tests/Browser
        env:
          JZOPC_BROWSER_BASE_URL: http://localhost:8080
          JZOPC_ACTIVE_FIXTURE_ROOT: /tmp/jzopc-active-fixture
        run: node active-checkout-browser-contract.mjs

      - name: Execute active finalization preflight Chromium contract
        if: matrix.native_opc == '0'
        working-directory: tests/Browser
        env:
          JZOPC_BROWSER_BASE_URL: http://localhost:8080
        run: node finalization-preflight-browser-contract.mjs

      - name: Execute PrestaShop 9.1 concurrent-tab finalization preflight Chromium contract
        if: matrix.family == '9.1' && matrix.native_opc == '0'
        working-directory: tests/Browser
        env:
          JZOPC_BROWSER_BASE_URL: http://localhost:8080
        run: node finalization-concurrent-tabs-preflight-browser-contract.mjs

      - name: Execute PrestaShop 9.1 orderable concurrent-tab finalization Chromium contract
        if: matrix.family == '9.1' && matrix.native_opc == '0'
        working-directory: tests/Browser
        env:
          JZOPC_BROWSER_BASE_URL: http://localhost:8080
        run: node finalization-orderable-concurrent-tabs-browser-contract.mjs

      - name: Execute PrestaShop 9.1 live-cart delivery-state diagnostic
        if: always() && matrix.family == '9.1' && matrix.native_opc == '0'
        run: |
          php /tmp/jzopc-active-fixture/tests/Runtime/ActiveCartDeliveryStateContract.php \
            /tmp/prestashop \
            "${{ matrix.family }}" \
            "$JZOPC_RUNTIME_PRODUCT_ID"

      - name: Execute active checkout failure fallback HTTP contract
        if: matrix.native_opc == '0'
        run: |
          php /tmp/jzopc-active-fixture/tests/Runtime/ActiveCheckoutFallbackHttpContract.php \
            http://localhost:8080 \
            /tmp/prestashop \
            "$JZOPC_RUNTIME_PRODUCT_ID"

      - name: Show Front Office server logs on failure
        if: failure()
        run: |
          cat /tmp/jzopc-prestashop-http.log 2>/dev/null || true
          cat /tmp/jzopc-prestashop-active-http.log 2>/dev/null || true