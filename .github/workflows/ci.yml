name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  php84:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install dependencies and build autoload
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find views/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Smoke tests
        run: bash scripts/run-smoke-tests.sh
